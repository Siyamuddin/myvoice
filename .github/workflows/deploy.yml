name: Deploy to Mac (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time; do not cancel an in-flight deploy (Hub pulls are slow).
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI (tests + build)
    runs-on: [self-hosted, mac, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Backend tests
        working-directory: saas-springboot
        run: |
          export JAVA_HOME=/opt/homebrew/opt/openjdk@21
          export PATH="$JAVA_HOME/bin:$PATH"
          ./mvnw -ntp test

      - name: Frontend build
        working-directory: saas-nextjs
        run: |
          npm ci
          npm run type-check
          npm run build
          npm test

  deploy:
    name: Deploy (docker compose on Mac)
    needs: ci
    runs-on: [self-hosted, mac, arm64]
    env:
      # Keep historical project name so existing volumes/networks stay attached.
      COMPOSE_PROJECT_NAME: fullstack-saas
      DEPLOY_MAX_ATTEMPTS: "5"
    steps:
      - name: Sync host repo to triggering commit
        run: |
          set -euo pipefail
          cd "$HOME/repos/myvoice"
          git fetch myvoice main --quiet
          git checkout --quiet "${{ github.sha }}" 2>/dev/null || \
            git checkout --quiet -B "deploy-${{ github.run_id }}" "${{ github.sha }}"
          echo "Host repo at: $(git rev-parse --short HEAD)"

      - name: Deploy with retries (in-repo)
        run: |
          set -euo pipefail
          cd "$HOME/repos/myvoice"
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

      - name: Restore host repo to main
        if: always()
        run: |
          set -euo pipefail
          cd "$HOME/repos/myvoice"
          git fetch myvoice main --quiet
          git checkout --quiet main
          git pull --ff-only myvoice main --quiet || true
          echo "Host repo restored to: $(git rev-parse --short HEAD)"
