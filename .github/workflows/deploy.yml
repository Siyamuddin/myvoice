name: Deploy to Mac (self-hosted)

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (tests + build)
    runs-on: [self-hosted, mac, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Backend tests
        working-directory: saas-springboot
        run: |
          export JAVA_HOME=/opt/homebrew/opt/openjdk@21
          export PATH="$JAVA_HOME/bin:$PATH"
          ./mvnw -ntp test

      - name: Frontend build
        working-directory: saas-nextjs
        run: |
          npm ci
          npm run type-check
          npm run build
          npm test

  deploy:
    name: Deploy (docker compose on Mac)
    needs: ci
    runs-on: [self-hosted, mac, arm64]
    steps:
      # Reuse the battle-tested host deploy script (~/.hermes/scripts/myvoice-deploy.sh)
      # which runs the CI gates + docker compose + health check + tailscale re-assert.
      # FORCE=1 skips the "no changes" check so it deploys the triggering commit.
      - name: Sync host repo to triggering commit
        run: |
          cd "$HOME/repos/myvoice"
          git fetch myvoice main --quiet
          git checkout --quiet "${{ github.sha }}" 2>/dev/null || \
            git checkout --quiet -b deploy-$(date +%s) "${{ github.sha }}"
          echo "Host repo at: $(git rev-parse --short HEAD)"

      - name: Run host deploy pipeline
        run: |
          FORCE=1 bash "$HOME/.hermes/scripts/myvoice-deploy.sh"

      - name: Restore host repo to main
        run: |
          cd "$HOME/repos/myvoice"
          git checkout --quiet main
          echo "Host repo restored to: $(git rev-parse --short main)"
